name: Compliance Check

on:
  pull_request:

jobs:
  compliance-check:
    name: Compliance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check compliance
        uses: printify/gha-shared-actions/compliance-check@v1.0.0
        with:
          validators: codeowners
